name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Quality, tests, migrations and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://taskminer_ci:taskminer_ci_password@localhost:5432/taskminer_test
      TEST_DATABASE_URL: postgresql+psycopg://taskminer_ci:taskminer_ci_password@localhost:5432/taskminer_test
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ALGORITHM: HS256
      STORAGE_PATH: /tmp/taskminer-ci-storage
      TASKMINER_LOG_LEVEL: WARNING

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskminer_test
          POSTGRES_USER: taskminer_ci
          POSTGRES_PASSWORD: taskminer_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskminer_ci -d taskminer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "httpx>=0.27,<1.0" "mypy>=1.13,<2.0" "pytest>=8.3,<9.0" "ruff>=0.8,<1.0"

      - name: Check code with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Check types with MyPy
        run: mypy .

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Check Alembic schema drift
        run: alembic check

      - name: Run backend tests
        run: pytest

      - name: Build backend Docker image
        run: docker build -f Dockerfile -t taskminer-backend .

      - name: Smoke-test backend Docker image
        run: |
          container_id=$(docker run --detach \
            --network host \
            --env PORT=9123 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env SECRET_KEY="$SECRET_KEY" \
            --env ACCESS_TOKEN_EXPIRE_MINUTES="$ACCESS_TOKEN_EXPIRE_MINUTES" \
            --env ALGORITHM="$ALGORITHM" \
            --env STORAGE_PATH="$STORAGE_PATH" \
            --env TASKMINER_LOG_LEVEL="$TASKMINER_LOG_LEVEL" \
            taskminer-backend)
          cleanup() {
            docker logs "$container_id"
            docker rm --force "$container_id"
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:9123/health > /dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:9123/health > /dev/null
          curl --fail --silent http://127.0.0.1:9123/docs > /dev/null
