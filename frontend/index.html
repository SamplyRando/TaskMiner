    <script>
      // Public pages follow the system theme (see usePublicAppearance).
      // Applying it before the first paint avoids a light flash; /app then
      // applies the user's own preference once it is loaded.
      try {
        if (
          !location.pathname.startsWith("/app") &&
          matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch {
        /* Theme stays light. */
      }
    </script>
