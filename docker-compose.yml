name: taskminer

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskminer_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TASKMINER_LOG_LEVEL: ${TASKMINER_LOG_LEVEL:-INFO}
      TASKMINER_AI_PROVIDER: ${TASKMINER_AI_PROVIDER:-mock}
      TASKMINER_OPENAI_MODEL: ${TASKMINER_OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TASKMINER_AI_RATE_LIMIT_REQUESTS: ${TASKMINER_AI_RATE_LIMIT_REQUESTS:-10}
      TASKMINER_AI_RATE_LIMIT_WINDOW_SECONDS: ${TASKMINER_AI_RATE_LIMIT_WINDOW_SECONDS:-60}
      TASKMINER_EMAIL_PROVIDER: ${TASKMINER_EMAIL_PROVIDER:-noop}
      TASKMINER_EMAIL_FROM: ${TASKMINER_EMAIL_FROM:-TaskMiner <invitations@taskminer.app>}
      TASKMINER_FRONTEND_URL: ${TASKMINER_FRONTEND_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      TASKMINER_BILLING_SUCCESS_URL: ${TASKMINER_BILLING_SUCCESS_URL:-http://localhost:3000/app/workspaces?billing=success}
      TASKMINER_BILLING_CANCEL_URL: ${TASKMINER_BILLING_CANCEL_URL:-http://localhost:3000/app/workspaces?billing=cancelled}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: ${ALGORITHM:?ALGORITHM is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?ACCESS_TOKEN_EXPIRE_MINUTES is required}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
    volumes:
      - backend_storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskminer_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskminer_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/nginx-health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - taskminer_network

networks:
  taskminer_network:
    name: taskminer_network
    driver: bridge

volumes:
  backend_storage:
    name: taskminer_backend_storage
  postgres_data:
    name: taskminer_postgres_data
